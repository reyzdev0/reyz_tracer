name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat folder android
        run: |
          flutter create --platforms=android --project-name reyz_tracer --org com.reyz _tmp
          rm -rf android
          cp -r _tmp/android android
          rm -rf _tmp
          sed -i 's/android:label="[^"]*"/android:label="Reyz Tracer Simulation"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          
          # 1. Paksa app utama pakai SDK 36 di file KTS
          find android/app -type f -name "build.gradle.kts" -exec sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' {} +
          
          # 2. Jurus pamungkas Kotlin DSL (KTS) untuk memaksa semua plugin pakai SDK 36
          if [ -f android/build.gradle.kts ]; then
            echo '' >> android/build.gradle.kts
            echo 'subprojects {' >> android/build.gradle.kts
            echo '    afterEvaluate {' >> android/build.gradle.kts
            echo '        if (project.hasProperty("android")) {' >> android/build.gradle.kts
            echo '            project.extensions.configure<com.android.build.gradle.BaseExtension>("android") {' >> android/build.gradle.kts
            echo '                compileSdkVersion(36)' >> android/build.gradle.kts
            echo '            }' >> android/build.gradle.kts
            echo '        }' >> android/build.gradle.kts
            echo '    }' >> android/build.gradle.kts
            echo '}' >> android/build.gradle.kts
          fi

      - name: Pakai keystore tetap
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get
      - run: flutter build apk --release --dart-define=BUILD=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: Reyz-Tracer-Simulation-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Buat release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
