name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Repo cuma berisi lib/, pubspec.yaml, keystore/; folder android dibuat otomatis di sini
      - name: Buat folder android
        run: |
          flutter create --platforms=android --project-name reyz_tracer --org com.reyz _tmp
          rm -rf android
          cp -r _tmp/android android
          rm -rf _tmp
          sed -i 's/android:label="[^"]*"/android:label="Reyz Tracer Simulation"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          
          # 1. Paksa Aplikasi pakai SDK 36
          find android/app -type f -name "build.gradle*" -exec sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' {} +
          find android/app -type f -name "build.gradle*" -exec sed -i 's/compileSdk = .*/compileSdk = 36/' {} +
          
          # 2. Paksa SEMUA Plugin (termasuk file_picker) pakai SDK 36 lewat environment property
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          
          # 3. Jurus pamungkas memaksa versi plugin di root gradle
          if [ -f android/build.gradle ]; then
            echo -e "\nsubprojects {\n    afterEvaluate { project ->\n        if (project.hasProperty('android')) {\n            project.android { compileSdkVersion 36 }\n        }\n    }\n}" >> android/build.gradle
          fi

      # Keystore tetap: tanpa ini tiap build punya tanda tangan beda, jadi harus uninstall dulu
      - name: Pakai keystore tetap
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get
      - run: flutter build apk --release --dart-define=BUILD=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: Reyz-Tracer-Simulation-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      # Rilis otomatis, dipakai fitur Update di dalam aplikasi
      - name: Buat release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
