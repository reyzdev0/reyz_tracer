name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat folder android
        run: |
          flutter create --platforms=android --project-name reyz_tracer --org com.reyz _tmp
          rm -rf android
          cp -r _tmp/android android
          rm -rf _tmp
          sed -i 's/android:label="[^"]*"/android:label="Reyz Tracer Simulation"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Pakai keystore tetap
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: Paksa SDK 36 Global
        run: |
          # Ganti seluruh baris yang berisi compileSdk / compileSdkVersion secara bersih
          find android ~/.pub-cache -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i -E 's/.*compileSdk(Version)?.*/compileSdk = 36/g' {} +

      - run: flutter build apk --release --dart-define=BUILD=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: Reyz-Tracer-Simulation-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Buat release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
